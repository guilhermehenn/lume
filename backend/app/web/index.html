<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Lume</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow">Passo 1 concluído · página provisória</p>
        <h1 id="app-name">Lume</h1>
        <p class="lead">O back-end está no ar e o banco local já existe. A interface completa chega no próximo passo.</p>
      </div>
      <span class="status" id="status" data-state="loading"><i></i><span id="status-text">Verificando…</span></span>
    </header>

    <section class="grid">
      <article class="card">
        <div class="card-h"><span class="tile tile-orange" aria-hidden="true"></span><h2>Banco de dados</h2></div>
        <dl id="db-info"></dl>
      </article>
      <article class="card">
        <div class="card-h"><span class="tile tile-green" aria-hidden="true"></span><h2>Backups</h2></div>
        <dl id="backup-info"></dl>
        <button type="button" id="backup-btn">Fazer backup agora</button>
        <p class="msg" id="backup-msg" role="status" aria-live="polite"></p>
      </article>
      <article class="card">
        <div class="card-h"><span class="tile tile-blue" aria-hidden="true"></span><h2>Ambiente</h2></div>
        <dl id="env-info"></dl>
      </article>
    </section>

    <section class="card">
      <div class="card-h"><span class="tile tile-gray" aria-hidden="true"></span><h2>Últimos backups</h2></div>
      <ul class="list" id="backup-list"></ul>
    </section>

    <footer class="foot">
      <span>Rodando só neste computador · 127.0.0.1</span>
      <a href="/api/docs">Documentação da API (precisa de internet)</a>
    </footer>
  </main>
</body>
</html>
