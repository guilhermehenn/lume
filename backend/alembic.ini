# Uso pela linha de comando, a partir da pasta backend/:
#   uv run alembic revision --autogenerate -m "descricao"
#   uv run alembic upgrade head
# O app roda as migrations sozinho ao iniciar (com backup antes).
# O banco usado vem da configuração do app (.env), não daqui.

[alembic]
script_location = %(here)s/app/data/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
