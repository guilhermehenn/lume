name: Release

# Publica uma release quando uma tag vX.Y.Z é enviada: confere a versão, monta a interface,
# empacota lume-vX.Y.Z.zip e usa as notas do CHANGELOG.md. O ZIP leva só o que o app precisa
# para rodar, com frontend/dist pronto: o .gitattributes (export-ignore) deixa de fora testes,
# código do front-end e arquivos de quem desenvolve.
# Rodado à mão (Actions → Release → Run workflow), só monta o ZIP para conferir, sem publicar.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Conferir a versão
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "APP_VERSION = '$v'" frontend/src/app/version.ts
          grep -q "\"version\": \"$v\"" frontend/package.json
          grep -q "__version__ = \"$v\"" backend/app/__init__.py
          grep -q "^version = \"$v\"" backend/pyproject.toml
          grep -q "^## \[$v\]" CHANGELOG.md

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Montar a interface
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Empacotar
        run: |
          pkg="lume-${GITHUB_REF_NAME//\//-}.zip"
          out="$RUNNER_TEMP/pkg"
          mkdir -p "$out"
          git archive --format=tar --prefix=lume/ HEAD | tar -x -C "$out"
          mkdir -p "$out/lume/frontend"
          cp -r frontend/dist "$out/lume/frontend/dist"
          (cd "$out" && zip -qr "$GITHUB_WORKSPACE/$pkg" lume)
          echo "PKG=$pkg" >> "$GITHUB_ENV"

      - name: Guardar o ZIP para conferir
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: lume-zip-de-teste
          path: ${{ env.PKG }}
          retention-days: 7

      - name: Notas da versão
        if: github.ref_type == 'tag'
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publicar
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "lume-$GITHUB_REF_NAME.zip" \
            --title "Lume ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag