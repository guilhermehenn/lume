name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Back-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Testes
        run: uv run pytest -q

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Checagem de tipos
        run: npm run typecheck
      - name: Testes de regras
        run: npm run test:unit
      - name: Montar a interface
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  e2e:
    name: Testes no navegador
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Dependências do back-end
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências do front-end
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      # O ubuntu-latest já traz o Google Chrome; os testes usam o canal "chrome".
      - name: Testes E2E
        working-directory: frontend
        env:
          LUME_BROWSER: chrome
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-results
          path: frontend/test-results
          retention-days: 7
